name: PR Build Test

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@10.28.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        id: type-check
        continue-on-error: true
        run: pnpm typecheck

      - name: Lint check
        id: lint
        continue-on-error: true
        run: pnpm lint --max-warnings 0

      - name: Format check
        id: format
        continue-on-error: true
        run: pnpm format:check

      - name: Build app
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Build size check
        if: steps.build.outcome == 'success'
        run: |
          BUILD_SIZE_KB=$(du -sk dist | cut -f1)
          BUILD_SIZE_MB=$((BUILD_SIZE_KB / 1024))

          echo "Build size: ${BUILD_SIZE_MB}MB"

          if [ "$BUILD_SIZE_MB" -gt 10 ]; then
            echo "Build size is larger than 10MB: ${BUILD_SIZE_MB}MB"
          elif [ "$BUILD_SIZE_MB" -gt 5 ]; then
            echo "Build size is moderate: ${BUILD_SIZE_MB}MB"
          else
            echo "Build size is optimal: ${BUILD_SIZE_MB}MB"
          fi

      - name: Upload build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: dist/
          retention-days: 1

      - name: Comment build results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              typescript: '${{ steps.type-check.outcome }}',
              eslint: '${{ steps.lint.outcome }}',
              prettier: '${{ steps.format.outcome }}',
              build: '${{ steps.build.outcome }}',
            };

            const icon = (outcome) =>
              outcome === 'success' ? '✅' : outcome === 'failure' ? '❌' : '⏭️';

            const label = (outcome) =>
              outcome === 'success' ? '통과' : outcome === 'failure' ? '실패' : '건너뜀';

            const allPassed = Object.values(results).every(
              (result) => result === 'success',
            );

            const body = [
              '## PR 검증 결과',
              '',
              `${icon(results.typescript)} **TypeScript:** ${label(results.typescript)}`,
              `${icon(results.eslint)} **ESLint:** ${label(results.eslint)}`,
              `${icon(results.prettier)} **Prettier:** ${label(results.prettier)}`,
              `${icon(results.build)} **Build:** ${label(results.build)}`,
              '',
              allPassed
                ? '🎉 모든 검증을 통과했습니다!'
                : '⚠️ 일부 검증에 실패했습니다. 확인 후 수정해주세요.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Check validation results
        if: always()
        run: |
          if [ "${{ steps.type-check.outcome }}" != "success" ] || \
             [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.format.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi
